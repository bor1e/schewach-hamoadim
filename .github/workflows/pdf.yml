name: Build & Tag PDF

on:
  push:
    branches: [main]
    paths:
      - "input/**"
      - "templates/**"
      - "scripts/**"
      - "fonts/**"
      - "build"
      - "VERSION"
      - ".github/workflows/pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        if: github.event_name == 'push'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.14.2"

      - name: Build Chanukka PDFs
        run: |
          VER="${{ steps.tag_version.outputs.new_tag }}"
          if [ -z "$VER" ]; then
            VER="$(./scripts/version.sh)"
          fi
          ./build proof --version "$VER"
          ./build a5 --version "$VER"

      - name: Commit archived PDFs
        if: github.event_name == 'push' && steps.tag_version.outputs.new_tag != ''
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build: Update archived PDFs to ${{ steps.tag_version.outputs.new_tag }} [skip ci]"
          file_pattern: "archive/*.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: schewach-hamoadim-chanukka-pdf
          path: |
            dist/proof-a5/book.pdf
            dist/pdf-a5/book.pdf
